<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark" />

  <title>Startpage</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <main class="dashboard">

    <section class="sidebar">

      <!-- Greeting -->
      <article class="panel greeting-panel">

        <div class="avatar">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="8" r="4"></circle>
            <path d="M4.5 20c.8-4 3.4-6 7.5-6s6.7 2 7.5 6"></path>
          </svg>
        </div>

        <div class="greeting-copy">
          <h1 id="greeting">
            Good afternoon, jkebwdn.
          </h1>

          <p id="date-time">
            17:56 • MON 24/08/26
          </p>
        </div>

      </article>


      <!-- Media -->
      <article class="panel">

        <h2>Media</h2>

        <nav class="link-list">

          <a
            href="https://app.plex.tv/"
            target="_blank"
            rel="noopener noreferrer"
          >
            <span class="icon brand-icon icon-fill">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M7 2h5.2L19 12l-6.8 10H7l6.8-10L7 2z"></path>
              </svg>
            </span>

            <span>Plex</span>
          </a>


          <a
            href="https://www.youtube.com/"
            target="_blank"
            rel="noopener noreferrer"
          >
            <span class="icon brand-icon">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <rect x="3" y="6" width="18" height="12" rx="3"></rect>
                <path d="M10 9l5 3-5 3V9z"></path>
              </svg>
            </span>

            <span>YouTube</span>
          </a>


          <a
            href="https://www.netflix.com/"
            target="_blank"
            rel="noopener noreferrer"
          >
            <span class="icon brand-icon icon-fill">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M6 3h4l8 18h-4L6 3z"></path>
                <path d="M14 3h4v18h-4V3z"></path>
                <path d="M6 3h4v18H6V3z"></path>
              </svg>
            </span>

            <span>Netflix</span>
          </a>


          <a
            href="https://www.primevideo.com/"
            target="_blank"
            rel="noopener noreferrer"
          >
            <span class="icon brand-icon">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M5 9c4-3 10-3 14 0"></path>
                <path d="M7 13c3 2 7 2 10 0"></path>
                <path d="M14 15l4-2-1 4"></path>
              </svg>
            </span>

            <span>Prime Video</span>
          </a>


          <a
            href="https://www.disneyplus.com/"
            target="_blank"
            rel="noopener noreferrer"
          >
            <span class="icon brand-icon">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M4 15c4-7 11-10 16-7"></path>
                <path d="M7 17h10"></path>
                <path d="M9 12c2 1 4 1 6 0"></path>
              </svg>
            </span>

            <span>Disney+</span>
          </a>

        </nav>

      </article>


      <!-- Tools -->
      <article class="panel">

        <h2>Tools</h2>

        <nav class="link-list">

          <a
            href="https://github.com/"
            target="_blank"
            rel="noopener noreferrer"
          >
            <span class="icon brand-icon icon-fill">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path
                  d="M12 2C6.5 2 2 6.6 2 12.2
                  c0 4.5 2.9 8.3 6.8 9.6
                  .5.1.7-.2.7-.5v-1.9
                  c-2.8.6-3.4-1.2-3.4-1.2
                  -.5-1.2-1.1-1.5-1.1-1.5
                  -.9-.7.1-.7.1-.7
                  1 .1 1.6 1.1 1.6 1.1
                  .9 1.6 2.4 1.1 3 .9
                  .1-.7.4-1.1.7-1.4
                  -2.2-.3-4.5-1.1-4.5-5
                  0-1.1.4-2 1-2.8
                  -.1-.3-.4-1.3.1-2.7
                  0 0 .8-.3 2.8 1.1
                  a9.2 9.2 0 0 1 5.1 0
                  c2-1.4 2.8-1.1 2.8-1.1
                  .5 1.4.2 2.4.1 2.7
                  .6.8 1 1.7 1 2.8
                  0 3.9-2.3 4.7-4.5 5
                  .4.3.7 1 .7 2v3
                  c0 .3.2.6.7.5
                  A10.2 10.2 0 0 0 22 12.2
                  C22 6.6 17.5 2 12 2z"
                ></path>
              </svg>
            </span>

            <span>GitHub</span>
          </a>


          <a
            href="https://chatgpt.com/"
            target="_blank"
            rel="noopener noreferrer"
          >
            <span class="icon brand-icon">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path
                  d="M12 3.2
                  a4.4 4.4 0 0 1 7.5 3.2
                  v.7
                  a4.4 4.4 0 0 1 1.5 7.7
                  l-.6.4
                  a4.4 4.4 0 0 1-5.8 5.5
                  l-.7-.4
                  a4.4 4.4 0 0 1-7.5-3.2
                  v-.7
                  A4.4 4.4 0 0 1 5 8.7
                  l.6-.4
                  A4.4 4.4 0 0 1 11.3 3
                  l.7.2z"
                ></path>

                <path d="M8.2 7.8l7.6 4.4v5"></path>
                <path d="M15.8 7.8l-7.6 4.4v5"></path>
                <path d="M12 5.5v8.8"></path>
              </svg>
            </span>

            <span>ChatGPT</span>
          </a>

        </nav>

      </article>


      <!-- Social -->
      <article class="panel">

        <h2>Social</h2>

        <nav class="link-list">

          <a
            href="https://x.com/"
            target="_blank"
            rel="noopener noreferrer"
          >
            <span class="icon brand-icon">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M5 4l14 16"></path>
                <path d="M19 4L5 20"></path>
              </svg>
            </span>

            <span>X</span>
          </a>


          <a
            href="https://www.reddit.com/"
            target="_blank"
            rel="noopener noreferrer"
          >
            <span class="icon brand-icon">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="12" cy="13" r="6.5"></circle>
                <circle cx="9.3" cy="12.2" r="1"></circle>
                <circle cx="14.7" cy="12.2" r="1"></circle>
                <path d="M9 15c1.6 1.1 4.4 1.1 6 0"></path>
                <path d="M14 6l1-3 3 1"></path>
                <circle cx="19" cy="5" r="1.3"></circle>
                <circle cx="5" cy="11" r="1.5"></circle>
                <circle cx="19" cy="11" r="1.5"></circle>
              </svg>
            </span>

            <span>Reddit</span>
          </a>

        </nav>

      </article>

    </section>


    <!-- Main -->
    <section class="content">

      <form
        class="search-bar"
        action="https://www.google.com/search"
        method="get"
      >
        <span class="search-icon">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="11" cy="11" r="6"></circle>
            <path d="M16 16l4 4"></path>
          </svg>
        </span>

        <input
          type="text"
          name="q"
          placeholder="Search the web..."
          autocomplete="off"
          aria-label="Search the web"
        />
      </form>


      <article class="panel pinterest-panel">

        <div class="panel-header">
          <h2>Pinterest Inspiration</h2>

          <span
            id="pinterest-status"
            class="pinterest-status"
          >
            Loading…
          </span>
        </div>


        <div
          id="pin-grid"
          class="pin-grid"
        >

          <div class="pinterest-loading">
            <span class="loading-spinner"></span>
            <span>Loading recent pins…</span>
          </div>

        </div>

      </article>

    </section>


    <!-- Theme selector -->
    <section class="panel theme-panel">

      <h2>Theme Selector</h2>

      <div class="theme-selector">

        <button
          class="theme-button selected"
          data-theme="everforest"
          title="Everforest"
          aria-label="Everforest"
        ></button>

        <button
          class="theme-button"
          data-theme="komorebi"
          title="Komorebi BlackMetalKhold"
          aria-label="Komorebi BlackMetalKhold"
        ></button>

        <button
          class="theme-button"
          data-theme="catppuccin"
          title="Catppuccin"
          aria-label="Catppuccin"
        ></button>

        <button
          class="theme-button"
          data-theme="zen"
          title="Arch / Zen"
          aria-label="Arch / Zen"
        ></button>

      </div>

    </section>

  </main>

  <script src="script.js"></script>

</body>
</html>

<!DOCTYPE html>

  <title>Startpage</title>

    <section class="sidebar">

      <article class="panel greeting-panel">
        <div class="avatar">
          <span>◯</span>
        </div>

        <div class="greeting-copy">
          <h1 id="greeting">Good afternoon.</h1>
          <p id="date-time">14:52 • SAT 24/08/26</p>
        </div>
      </article>

      <article class="panel">
        <h2>Media</h2>

        <nav class="link-list">
          <a href="https://app.plex.tv/" target="_blank">
            <span class="icon">▶</span>
            <span>Plex</span>
          </a>

          <a href="https://www.youtube.com/" target="_blank">
            <span class="icon">▻</span>
            <span>YouTube</span>
          </a>
        </nav>
      </article>

      <article class="panel">
        <h2>Tools</h2>

        <nav class="link-list">
          <a href="https://github.com/" target="_blank">
            <span class="icon">●</span>
            <span>GitHub</span>
          </a>

          <a href="https://chatgpt.com/" target="_blank">
            <span class="icon">◉</span>
            <span>ChatGPT</span>
          </a>
        </nav>
      </article>

      <article class="panel">
        <h2>Social</h2>

        <nav class="link-list">
          <a href="https://x.com/" target="_blank">
            <span class="icon">𝕏</span>
            <span>X</span>
          </a>

          <a href="https://www.reddit.com/" target="_blank">
            <span class="icon">◌</span>
            <span>Reddit</span>
          </a>
        </nav>
      </article>

    </section>


    <section class="content">

      <form
        class="search-bar"
        action="https://www.google.com/search"
        method="get"
        target="_blank"
      >
        <span class="search-icon">⌕</span>

        <input
          type="text"
          name="q"
          placeholder="Search the web..."
          autocomplete="off"
          aria-label="Search the web"
        />
      </form>

    <section class="panel theme-panel">

      <h2>Theme Selector</h2>

      <div class="theme-selector">

        <button
          class="theme-button selected"
          data-theme="everforest"
          title="Everforest"
          aria-label="Everforest"
        ></button>

          class="theme-button"
